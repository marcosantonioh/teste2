{% load static %}

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="salvar_perfil">

    <!-- Avatar de Perfil -->
    <div class="profile-photo-section">
        <img id="preview-img" src="{% static perfil.avatar_arquivo %}" alt="Avatar atual" />
        <fieldset class="avatar-selection">
            <legend>Escolha seu avatar</legend>
            <div class="avatar-grid">
                {% for avatar in avatares %}
                    <div class="avatar-option">
                        <input
                            type="radio"
                            id="avatar-{{ avatar.valor }}"
                            name="avatar"
                            value="{{ avatar.valor }}"
                            data-avatar-url="{% static avatar.arquivo %}"
                            {% if perfil.avatar == avatar.valor %}checked{% endif %}
                        >
                        <label for="avatar-{{ avatar.valor }}">
                            <img src="{% static avatar.arquivo %}" alt="">
                            <span>{{ avatar.nome }}</span>
                        </label>
                    </div>
                {% endfor %}
            </div>
        </fieldset>
    </div>

    <!-- Nome -->
    <div class="form-group">
        <label for="Nome">Nome</label>
        <input id="Nome" name="Nome" value="{{ perfil.user.username }}" required>
    </div>

    <!-- Email -->
    <div class="form-group">
        <label for="id_email">Email</label>
        <input type="email" id="id_email" name="email" value="{{ perfil.user.email }}" required />
    </div>

    <!-- Bio -->
    <div class="bio-section">
        <label for="id_bio">Biografia</label>
        <textarea id="id_bio" name="bio">{{ perfil.bio }}</textarea>
    </div>

    <button type="submit" class="btn-salvar">Salvar alterações</button>

</form>
