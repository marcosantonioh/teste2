{% load static %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Foto de Perfil -->
    <div class="profile-photo-section">
        {% if perfil.foto %}
        <img id="preview-img" src="{{ perfil.foto.url }}" alt="Foto de Perfil" />
        {% else %}
        <img id="preview-img" src="{% static 'img/default.png' %}" alt="Foto padrão" />
        {% endif %}
        <div class="foto-actions">
        <label for="id_foto">Foto de perfil</label><br>

        <!-- Input file escondido -->
        <input type="file" name="foto" id="id_foto" class="input-foto" style="display: none;" accept="image/*" />

        <div class="foto-botoes">
            <!-- Botão para abrir seletor de arquivo -->
            <button type="button" class="btn-foto" onclick="document.getElementById('id_foto').click();">Alterar</button>

            <!-- Botão para deletar -->
            <button type="submit" name="action" value="deletar_foto" class="btn-foto btn-danger">Remover</button>
        </div>
        </div>
    </div>

    <!-- Nome -->
    <div class="form-group">
        <label for="Nome">Nome</label>
        <input id="Nome" name="Nome" value="{{ perfil.user.username }}" required>
    </div>

    <!-- Email -->
    <div class="form-group">
        <label for="id_email">Email</label>
        <input type="email" id="id_email" name="email" value="{{ perfil.user.email }}" required />
    </div>

    <!-- Bio -->
    <div class="bio-section">
        <label for="id_bio">Biografia</label>
        <textarea id="id_bio" name="bio">{{ perfil.bio }}</textarea>
    </div>

    <button type="submit" class="btn-salvar">Salvar alterações</button>

</form>
