{% load static %}

<!-- Componente da Lista de Amigos -->
<div class="box lista">
  <!-- Abas -->
  <div class="tabs">
    <button class="tab active" onclick="mostrarAba('segue')">Amigos</button>
  </div>

  <!-- Conteúdo das Abas -->
  <div id="segue" class="tab-content active">
    {% for amigo in amigos|slice:":3" %} 
    <div class="perfil-item">
      <img
        src="{% static amigo.perfil.avatar_arquivo %}"
        alt="Avatar de {{ amigo.username }}"
      />
      <div>
        <strong>{{ amigo.username }}</strong><br />
        <span>{{ amigo.perfil.xp }} XP</span>
      </div>
    </div>
    {% empty %}

    <div class="info">
      <img src="/static/img/cacto.svg" alt="" class="sad-mascote" />
      <p>Você não segue ninguém ainda.</p>
    </div>
    

    {% endfor %} {% if amigos|length > 3 %}
    <div class="ver-mais">
      <a href="{% url 'usuarios:amigos' %}"
        >Ver mais {{ amigos|length|add:"-3" }}</a
      >
    </div>
    {% endif %}
  </div>

</div>

<!-- Script de abas (mantido junto ao componente para ser autossuficiente) -->
<script>
  function mostrarAba(id) {
    // Garante que o escopo seja local para o container do componente, se houver múltiplos na página
    const container = document.querySelector(".box.lista");
    container
      .querySelectorAll(".tab")
      .forEach((btn) => btn.classList.remove("active"));
    container
      .querySelectorAll(".tab-content")
      .forEach((content) => content.classList.remove("active"));

    container
      .querySelector(`.tab[onclick="mostrarAba('${id}')"]`)
      .classList.add("active");
    container.querySelector(`#${id}`).classList.add("active");
  }
</script>
