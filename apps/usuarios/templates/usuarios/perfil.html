{% load static %}

<link
  rel="stylesheet"
  href="{% static 'style/partials/usuarios/perfil.css' %}"
/>

{% block content %}

<div class="container">
  <div class="content-perfil">
    <form method="post">
      {% csrf_token %}

      <div class="head">
        <div class="infos">
          <!-- Foto de Perfil -->
          <div class="form-group">
            <label>Foto de Perfil</label>
            <img src="{{ perfil.foto_perfil.url }}" alt="Foto de Perfil" />
          </div>

          <div class="form-group">
            <label>Nome</label>
            <p>{{ user.username }}</p>
          </div>

          <div class="form-group">
            <label>Pontos</label>
            <p>{{ perfil.pontos }}</p>

          </div>

          <!-- Bio -->
          <div class="form-group">
            <label>Bio</label>
            <p>{{ perfil.bio }}</p>
          </div>

          <!-- Seguidores e Seguidos -->
          <div class="form-group">
            <label>Seguidores</label>
            <p>{{ perfil.seguidores }}</p>
            <label>Seguidos</label>
            <p>{{ perfil.seguidos }}</p>
          </div>

          <!-- Data de Início -->
          <div class="form-group">
            <label>Data de Início</label>
            <p>{{ perfil.data_inicio|date:"d/m/Y H:i" }}</p>
            <!-- Formato de data e hora -->
          </div>
        </div>
      </div>

    </form>
  </div>
</div>

{% endblock %}
