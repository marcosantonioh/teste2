{% extends 'navbar.html' %} {% load static %} {% block content %}

<link
  rel="stylesheet"
  href="{% static 'style/partials/exercicios/percurso.css' %}"
/>
<link rel="stylesheet" href="{% static 'style/global/button-play.css' %}">

<body>

  <div class="container">
    {% for secao in secoes %}
      <div class="header-wrapper">
        <div class="page-header">
          <a href="{% url 'exercicios:modulos' %}" class="back-button">
            <img
              src="/static/img/back_white.svg"
              alt="Voltar"
              class="back-icon"
            />
          </a>
          
          <h1 class="section-title">{{secao.nome}}</h1>
          
          <button class="guide-button">
            <!-- Conteúdo do botão -->
          </button>
        </div>
      </div>


      <div class="module-description">
        <div class="stations">
          {% for estacao in secao.estacoes.all %}
            <!-- Aqui você inclui o botão -->
            {% include "modules/button-play.html" %}
          {% endfor %}
        </div>
      </div>

    {% endfor %}

  </div>


</body>


<script>
  function toggleDrop(estacaoId) {
    const targetDropdownId = `dropdown-${estacaoId}`;
    const targetDropdown = document.getElementById(targetDropdownId);

    if (!targetDropdown) {
        console.error(`Dropdown com ID ${targetDropdownId} não encontrado.`);
        return;
    }
    
    // Assumindo que .station-circle é o pai direto do .station-dropdown
    // Se a estrutura for diferente em button-play.html, ajuste esta linha.
    // Por exemplo, se o dropdown estiver aninhado mais profundamente:
    // const stationCircle = document.getElementById(estacaoId).closest('.station-circle');
    // Ou, se o ID do círculo for diferente do ID da estação para o dropdown:
    const stationCircle = targetDropdown.closest('.station-circle'); // Mais robusto se o ID do círculo não for `estacaoId`
    
    // Verifica se o dropdown alvo está atualmente visível
    const isTargetVisible = targetDropdown.style.display === 'block';

    // Primeiro, fecha todos os dropdowns abertos e remove a classe ativa de todos os círculos
    const allDropdowns = document.querySelectorAll('.station-dropdown');
    allDropdowns.forEach(dropdown => {
        dropdown.style.display = 'none';
    });

    const allCircles = document.querySelectorAll('.station-circle');
    allCircles.forEach(circle => {
        circle.classList.remove('station-circle-active');
    });

    // Se o dropdown alvo não estava visível (ou era um diferente que estava visível), abre-o e ativa seu círculo
    // Se estava visível, ele já foi fechado pelo loop acima, alcançando o efeito de toggle.
    if (!isTargetVisible) {
        targetDropdown.style.display = 'block';
        if (stationCircle) { // Garante que stationCircle foi encontrado
            stationCircle.classList.add('station-circle-active');
        }
    }
}

// Opcional: Fecha o dropdown ao clicar fora dele
window.addEventListener('click', function(event) {
    // Verifica se o clique foi em um círculo de estação ou dentro de um dropdown
    const clickedOnStationCircle = event.target.closest('.station-circle');
    const clickedInsideDropdown = event.target.closest('.station-dropdown');

    // Se o clique foi fora de ambos
    if (!clickedOnStationCircle && !clickedInsideDropdown) {
        const allDropdowns = document.querySelectorAll('.station-dropdown');
        allDropdowns.forEach(dropdown => {
            dropdown.style.display = 'none';
        });

        const allCircles = document.querySelectorAll('.station-circle');
        allCircles.forEach(circle => {
            circle.classList.remove('station-circle-active');
        });
    }
});
</script>


{% endblock %}
