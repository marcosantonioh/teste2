     id="defs2"><style>
       @keyframes dispersar-esquerda {
         0%, 30% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
         48%, 100% { opacity: 0; transform: translate(-12px, -18px) rotate(-18deg); }
       }
       @keyframes dispersar-direita {
         0%, 34% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
         52%, 100% { opacity: 0; transform: translate(13px, -14px) rotate(16deg); }
       }
       @keyframes dispersar-baixo {
         0%, 38% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
         56%, 100% { opacity: 0; transform: translate(-8px, 15px) rotate(12deg); }
       }
       @keyframes dispersar-cima {
         0%, 42% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
         60%, 100% { opacity: 0; transform: translate(9px, -22px) rotate(-14deg); }
       }
       @keyframes desligar-olhos {
         0%, 35% { opacity: 1; }
         48%, 100% { opacity: 0; }
       }
       @keyframes pulsar-sensor {
         0%, 100% { opacity: 0.42; }
         50% { opacity: 1; }
       }
       @keyframes unir-sensor-esquerdo {
         0%, 62% { transform: translateX(0); }
         70%, 100% { transform: translateX(42px); }
       }
       @keyframes unir-sensor-direito {
         0%, 62% { transform: translateX(0); }
         70%, 100% { transform: translateX(-42px); }
       }
       #layer1 > rect:nth-of-type(-n+34) {
         transform-box: fill-box;
         transform-origin: center;
         animation-duration: 8s;
         animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
         animation-iteration-count: infinite;
         animation-direction: alternate;
         animation-fill-mode: both;
       }
       #layer1 > rect:nth-of-type(4n+1):nth-of-type(-n+34) {
         animation-name: dispersar-esquerda;
       }
       #layer1 > rect:nth-of-type(4n+2):nth-of-type(-n+34) {
         animation-name: dispersar-direita;
       }
       #layer1 > rect:nth-of-type(4n+3):nth-of-type(-n+34) {
         animation-name: dispersar-baixo;
       }
       #layer1 > rect:nth-of-type(4n):nth-of-type(-n+34) {
         animation-name: dispersar-cima;
       }
       #rect1174, #rect1175, #rect1176, #rect1177, #rect1178 {
         animation: desligar-olhos 8s ease-in-out infinite alternate;
       }
       #rect1170, #rect1171, #rect1172, #rect1173 {
         transform-box: fill-box;
         transform-origin: center;
       }
       #rect1170 {
         animation: unir-sensor-esquerdo 8s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
       }
       #rect1172 {
         animation: unir-sensor-direito 8s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
       }
       #rect1171 {
         animation: pulsar-sensor 1.4s ease-in-out infinite,
           unir-sensor-esquerdo 8s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
       }
       #rect1173 {
         animation: pulsar-sensor 1.4s ease-in-out infinite,
           unir-sensor-direito 8s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
       }
